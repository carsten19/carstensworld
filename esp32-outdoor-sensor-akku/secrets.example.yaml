# Kopieren nach secrets.yaml und eigene Werte eintragen.
# IP-Adresse oder Hostname deines MQTT-Brokers (z. B. Mosquitto)
mqtt_broker: 192.168.1.10
# Thread-Netzwerk-Datensatz (Active Dataset TLV, Hex-String) deines Border Routers.
# In Home Assistant: Einstellungen → Geräte & Dienste → Thread → Konfigurieren → (i) beim Netzwerk.
openthread_tlv: "0e080000000000010000000300000f35060004001fffe0"  # Platzhalter, durch eigenen Datensatz ersetzen
