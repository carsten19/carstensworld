            width: 900
            height: 520
            bg_color: 0xFFFFFF
            bg_opa: COVER
            border_color: 0x000000
            border_width: 3
            radius: 10
            pad_all: 28
            widgets:
              - label:
                  id: weather_overview_label
                  width: 840
                  height: 455
                  text: "Wetterdaten werden geladen ..."
                  text_font: font_weather_large
                  text_color: 0x000000
                  long_mode: WRAP

        - obj:
            x: 970
            y: 125
            width: 590
            height: 520
            bg_color: 0xFFFFFF
            bg_opa: COVER
            border_color: 0x000000
            border_width: 3
            radius: 10
            pad_all: 26
            widgets:
              - label:
                  id: weather_metrics_label
                  width: 530
                  height: 360
                  text: "Noch keine Messwerte"
                  text_font: font_weather_medium
                  text_color: 0x000000
                  long_mode: WRAP
              - label:
                  id: frame_status_label
                  y: 420
                  width: 530
                  text: "FRAME"
                  text_font: font_forecast
                  text_color: 0x0000FF
                  long_mode: WRAP

        - label:
            x: 45
            y: 680
            text: "7-TAGE-VORHERSAGE"
            text_font: font_weather_medium
            text_color: 0x000000

        - obj:
            x: 25
            y: 740
            width: 210
            height: 430
            bg_color: 0xFFFFFF
            bg_opa: COVER
            border_color: 0x000000
            border_width: 3
            radius: 10
            pad_all: 12
            widgets:
              - label:
                  id: forecast_0_label
                  width: 180
                  height: 395
                  text: "HEUTE"
                  text_font: font_forecast
                  text_align: CENTER
                  long_mode: WRAP

        - obj:
            x: 247
            y: 740
            width: 210
            height: 430
            bg_color: 0xFFFFFF
            bg_opa: COVER
            border_color: 0x000000
            border_width: 3
            radius: 10
            pad_all: 12
            widgets:
              - label:
                  id: forecast_1_label
                  width: 180
                  height: 395
                  text: "TAG 2"
                  text_font: font_forecast
                  text_align: CENTER
                  long_mode: WRAP

        - obj:
            x: 469
            y: 740
            width: 210
            height: 430
            bg_color: 0xFFFFFF
            bg_opa: COVER
            border_color: 0x000000
            border_width: 3
            radius: 10
            pad_all: 12
            widgets:
              - label:
                  id: forecast_2_label
                  width: 180
                  height: 395
                  text: "TAG 3"
                  text_font: font_forecast
                  text_align: CENTER
                  long_mode: WRAP

        - obj:
            x: 691
            y: 740
            width: 210
            height: 430
            bg_color: 0xFFFFFF
            bg_opa: COVER
            border_color: 0x000000
            border_width: 3
            radius: 10
