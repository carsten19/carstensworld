# Beispielwerte, als secrets.yaml im ESPHome-Ordner anlegen und eigene Werte eintragen.
# API-Schlüssel erzeugen: https://esphome.io/components/api/#configuration-variables
api_encryption_key: "BASE64-SCHLUESSEL-MIT-32-BYTE"
# Thread-Datensatz (TLV, Hex) des eigenen Border Routers, z. B. aus Home Assistant
# unter Einstellungen → Geräte & Dienste → Thread → Netzwerk → Informationen.
openthread_tlv: "0e080000000000010000..."
